name: Build, scan and sign
on:
  workflow_call:
    outputs:
      image:
        description: Verified multiarchitecture image reference (pushes to main only)
        value: ${{ jobs.release.outputs.image }}
      artifact-id:
        description: Immutable release artifact ID
        value: ${{ jobs.release.outputs.artifact-id }}
permissions:
  contents: read
jobs:
  test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: surya-8143/paved-road-platform
          ref: 7f9fb01d8cf6b81014e72ad50e87c40d73fa831c
          path: .platform
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies and security scanner
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
          python .platform/scripts/install_tools.py trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint and test
        run: |
          python -m ruff check app scripts tests
          python -m ruff format --check app scripts tests
          make test
      - name: Build reproducible Lambda package
        run: |
          make package
          first=$(sha256sum build/lambda.zip | cut -d ' ' -f 1)
          make package
          test "$first" = "$(sha256sum build/lambda.zip | cut -d ' ' -f 1)"
          bash scripts/smoke_lambda.sh
      - name: Scan deployed ZIP contents
        run: |
          python .platform/scripts/scan_artifact.py lambda build/lambda.zip build/security
          cp build/lambda.zip build/security/lambda.zip
      - name: Retain scanner evidence even on a failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-scan-evidence
          path: |
            build/security/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve gated Lambda package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda
          path: build/security/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  image:
    needs: test-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: surya-8143/paved-road-platform
          ref: 7f9fb01d8cf6b81014e72ad50e87c40d73fa831c
          path: .platform
          persist-credentials: false
      - name: Install scanner
        run: |
          python3 .platform/scripts/install_tools.py trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build once and exercise the same image
        run: |
          docker build --platform "linux/$ARCH" --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "paved-road-ci:$ARCH" .
          bash scripts/smoke_container.sh "paved-road-ci:$ARCH"
      - name: Scan and preserve the exact built image
        run: |
          python3 .platform/scripts/scan_artifact.py image "paved-road-ci:$ARCH" build/image
          docker image inspect --format '{{.Id}}' "paved-road-ci:$ARCH" > build/image/image.id
          docker save --output build/image/image.tar "paved-road-ci:$ARCH"
          cd build/image
          sha256sum image.tar > image.tar.sha256
      - name: Retain scanner evidence even on a failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan-${{ matrix.architecture }}
          path: build/image/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve gated image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.architecture }}
          path: build/image/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-package, image]
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      ARCH: ${{ matrix.architecture }}
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      # Privileged jobs never execute files from the caller's checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: surya-8143/paved-road-platform
          ref: 7f9fb01d8cf6b81014e72ad50e87c40d73fa831c
          path: .platform
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.architecture }}
          path: artifacts/image-${{ matrix.architecture }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install signer and validate signing context
        run: |
          python3 .platform/scripts/install_tools.py cosign
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 .platform/scripts/signing_identity.py
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push, sign, attest and verify
        run: bash .platform/scripts/publish_image.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: released-${{ matrix.architecture }}
          path: artifacts/image-${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 7
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-package, image, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    outputs:
      image: ${{ steps.manifest.outputs.image }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: surya-8143/paved-road-platform
          ref: 7f9fb01d8cf6b81014e72ad50e87c40d73fa831c
          path: .platform
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: released-*
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda
          path: artifacts/lambda
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install signer and validate signing context
        run: |
          python3 .platform/scripts/install_tools.py cosign
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 .platform/scripts/signing_identity.py
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish signed index and release manifest
        id: manifest
        run: |
          bash .platform/scripts/publish_release.sh
          echo "image=$(jq -er '.image' artifacts/release.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: verified-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
