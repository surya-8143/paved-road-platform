name: Platform checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: |
          python3 scripts/install_tools.py actionlint trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate workflow and helper behavior
        run: |
          actionlint
          python3 -m unittest discover -s tests -v
          bash -n scripts/*.sh
      - name: Prove a real vulnerability blocks the gate
        run: |
          if python3 scripts/scan_artifact.py fs tests/fixtures/vulnerable build/negative-scan; then
            echo 'The deliberately vulnerable fixture passed the gate' >&2
            exit 1
          fi
          python3 -c 'import json; r=json.load(open("build/negative-scan/scan.json")); assert any(v["Severity"] in ("HIGH", "CRITICAL") for i in r["Results"] for v in i.get("Vulnerabilities", []))'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: negative-scan-evidence
          path: build/negative-scan/*.json
          if-no-files-found: ignore
          retention-days: 7
