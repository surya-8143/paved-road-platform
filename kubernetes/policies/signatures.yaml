apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: paved-road-trusted-builds
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  autogen:
    podControllers:
      controllers: [deployments]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: paved-road-demo
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  images:
    - name: allContainers
      expression: >-
        object.spec.containers.map(c, c.image) + (has(object.spec.initContainers) ? object.spec.initContainers.map(c, c.image) : [])
  matchImageReferences:
    - glob: '*'
  validationConfigurations:
    required: true
    verifyDigest: true
    mutateDigest: false
  attestors:
    - name: demo
      cosign:
        annotations:
          repository: surya-8143/paved-road-demo-service
          ref: refs/heads/main
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/surya-8143/paved-road-platform/.github/workflows/build-scan-sign.yml@ae9fce4325796a513e52492e0bf4850948108b6a
        ctlog:
          url: https://rekor.sigstore.dev
    - name: template
      cosign:
        annotations:
          repository: surya-8143/paved-road-template
          ref: refs/heads/main
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/surya-8143/paved-road-platform/.github/workflows/build-scan-sign.yml@ae9fce4325796a513e52492e0bf4850948108b6a
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    - expression: >-
        images.allContainers.all(image,
          image.startsWith('ghcr.io/surya-8143/paved-road-demo-service@sha256:')
            ? verifyImageSignatures(image, [attestors.demo]) > 0
            : (image.startsWith('ghcr.io/surya-8143/paved-road-template@sha256:')
                ? verifyImageSignatures(image, [attestors.template]) > 0 : false))
      message: Images must be signed by the pinned platform workflow with matching repository and main-branch claims.
