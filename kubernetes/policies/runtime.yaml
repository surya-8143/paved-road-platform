apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: paved-road-runtime
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  webhookConfiguration:
    timeoutSeconds: 15
  autogen:
    podControllers:
      controllers: [deployments]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: paved-road-demo
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: variables.containers.all(c, c.image.matches('^ghcr[.]io/surya-8143/paved-road-(template|demo-service)@sha256:[a-f0-9]{64}$'))
      message: Every container and init container must use an approved repository and immutable SHA-256 digest.
    - expression: >-
        variables.containers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation &&
          has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem &&
          has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) &&
          c.securityContext.capabilities.drop.exists(cap, cap == 'ALL'))
      message: Containers require a read-only filesystem, no privilege escalation, and all capabilities dropped.
    - expression: >-
        variables.containers.all(c,
          has(c.resources) && has(c.resources.requests) && has(c.resources.limits) &&
          ['cpu', 'memory'].all(key, key in c.resources.requests && key in c.resources.limits) &&
          c.resources.requests['cpu'].matches('^[1-9][0-9]*m?$') &&
          c.resources.limits['cpu'].matches('^[1-9][0-9]*m?$') &&
          c.resources.requests['memory'].matches('^[1-9][0-9]*(Mi|Gi)$') &&
          c.resources.limits['memory'].matches('^[1-9][0-9]*(Mi|Gi)$'))
      message: Set positive CPU requests/limits in whole cores or millicores and memory in Mi/Gi.
    - expression: has(object.spec.automountServiceAccountToken) && !object.spec.automountServiceAccountToken
      message: The demo service must not mount a Kubernetes API token.
    - expression: '!has(object.spec.ephemeralContainers) || size(object.spec.ephemeralContainers) == 0'
      message: Ephemeral debug containers are disabled in this demo profile; use reviewed exec access.
