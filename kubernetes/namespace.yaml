apiVersion: v1
kind: Namespace
metadata:
  name: paved-road-demo
  labels:
    project: paved-road
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: demo-budget
  namespace: paved-road-demo
spec:
  hard:
    pods: "4"
    requests.cpu: "800m"
    requests.memory: "1Gi"
    limits.cpu: "2"
    limits.memory: "2Gi"
    services.loadbalancers: "0"
    services.nodeports: "0"
