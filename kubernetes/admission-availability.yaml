# Native API-server guard: Kyverno removes its webhooks during a zero-replica
# graceful shutdown. Prevent accidental scale-to-zero/deletion independently.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: paved-road-admission-availability
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kyverno
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [UPDATE, DELETE]
        resources: [deployments, deployments/scale]
  matchConditions:
    - name: controller
      expression: request.name == 'kyverno-admission-controller'
  validations:
    - expression: request.operation != 'DELETE' && object != null && has(object.spec.replicas) && object.spec.replicas >= 1
      message: Keep at least one Kyverno admission replica; remove the availability binding explicitly before intentional uninstall.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: paved-road-admission-availability
spec:
  policyName: paved-road-admission-availability
  validationActions: [Deny]
